# PhoneVR-MotoG5 — .github/workflows/build-android.yml
# Builds the Android APK (minSdk 24) on every push and PR.
name: Build Android APK

on:
  push:
    branches: ["**"]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build PhoneVR-MotoG5.apk
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386

      - name: Install NDK and CMake
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneVR-MotoG5-debug
          path: android-app/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 30
