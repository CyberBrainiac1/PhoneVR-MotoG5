# PhoneVR-MotoG5 — android-app/gradle.properties

# Required: use AndroidX instead of legacy Support Library namespaces.
# Without this, AGP fails with "useAndroidX property is not enabled"
# even when all dependencies already use androidx.* coordinates.
android.useAndroidX=true

# Suppress auto-migration warnings (we are already on AndroidX)
android.enableJetifier=false

# Increase heap for larger builds (NDK + Kotlin compile)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Enable configuration cache for faster incremental builds
org.gradle.configuration-cache=true
